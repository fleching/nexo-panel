<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXO - Register</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 420px; }
        .logo { text-align: center; margin-bottom: 40px; }
        .logo h1 {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .logo p { color: #71717a; font-size: 14px; }
        .card {
            background: #12121a;
            border: 1px solid #27272a;
            border-radius: 20px;
            padding: 40px;
        }
        .card h2 { color: #fff; font-size: 24px; font-weight: 600; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; color: #a1a1aa; font-size: 14px; margin-bottom: 8px; }
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a25;
            border: 1px solid #27272a;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #9333ea;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.2);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            box-shadow: 0 8px 25px rgba(147, 51, 234, 0.4);
            transform: translateY(-2px);
        }
        .divider { display: flex; align-items: center; margin: 25px 0; color: #71717a; font-size: 13px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #27272a; }
        .divider span { padding: 0 15px; }
        .link { text-align: center; color: #a1a1aa; font-size: 14px; }
        .link a { color: #a855f7; text-decoration: none; font-weight: 500; }
        .link a:hover { text-decoration: underline; }
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-error { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .alert-success { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(147, 51, 234, 0.08) 0%, transparent 50%);
            animation: pulse 15s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .key-info {
            background: rgba(147, 51, 234, 0.1);
            border: 1px solid rgba(147, 51, 234, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #a855f7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1><i class="fas fa-skull"></i> NEXO</h1>
            <p>Create your account</p>
        </div>

        <div class="card">
            <h2>Register</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <i class="fas fa-{{ 'check-circle' if category == 'success' else 'exclamation-circle' }}"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="key-info">
                <i class="fas fa-key"></i> A valid license key is required to register.
            </div>

            <form method="POST">
                <div class="form-group">
                    <label class="form-label">License Key</label>
                    <input type="text" name="license_key" class="form-input" placeholder="NEXO-XXXX-XXXX" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-input" placeholder="Choose a username" required minlength="3">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Create a password" required minlength="6">
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-input" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="divider"><span>or</span></div>

            <p class="link">
                Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
            </p>
        </div>
    </div>
</body>
</html>
